<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>mitano. Anmeldung</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A8412C}a:hover{color:#4A1E14}
input::placeholder{color:#7A6A64}
</style>
</helmet>
<div style="width: 390px; height: 920px; box-sizing: border-box; padding: 0 20px 36px; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(circle at 12% 6%, rgba(78, 191, 239, 0.30) 0%, rgba(78, 191, 239, 0) 42%), radial-gradient(circle at 95% 38%, rgba(247, 167, 146, 0.50) 0%, rgba(247, 167, 146, 0) 48%), radial-gradient(circle at 5% 88%, rgba(255, 210, 190, 0.95) 0%, rgba(255, 210, 190, 0) 55%), linear-gradient(170deg, #F4F8FC 0%, #FFFFFF 40%, #FFF3EC 100%); font-family: Inter, system-ui, sans-serif; color: #0A0A0A">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px">
<div style="width: 200px; height: 200px; border-radius: 45px; background: radial-gradient(circle at 18% 10%, rgba(78, 191, 239, 0.22) 0%, rgba(78, 191, 239, 0) 55%), linear-gradient(145deg, #E6F1FA 0%, #FFFFFF 42%, #FFF3EC 70%, #FFDCCB 100%); display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 8px 22px rgba(168, 65, 44, 0.18)">
<svg width="200" height="200" viewBox="0 0 100 100" aria-hidden="true" style="filter: drop-shadow(0 2px 5px rgba(168, 65, 44, 0.22))">
<defs>
<linearGradient id="lf" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#FFE6DA"></stop></linearGradient>
<linearGradient id="lh" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#F7A792"></stop><stop offset="1" stop-color="#E9806A"></stop></linearGradient>
</defs>
<path d="M50 16 a33 33 0 1 1 -18.5 60.4 L15 84 l6 -16 A33 33 0 0 1 50 16 Z" fill="url(#lf)"></path>
<path d="M25 33 C25 14 37 7 50 7 C63 7 75 14 75 33 Z" fill="url(#lh)"></path>
<rect x="21" y="27" width="58" height="10" rx="5" fill="url(#lh)"></rect>
<circle cx="40" cy="50" r="3.8" fill="#7E3A2B"></circle><circle cx="60" cy="50" r="3.8" fill="#7E3A2B"></circle>
<path d="M44 56 Q50 54 56 56 Q57 59.5 50 62 Q43 59.5 44 56 Z" fill="#7E3A2B"></path>
<circle cx="82" cy="78" r="5" fill="#E9806A"></circle>
</svg>
</div>
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: #0A0A0A; width: 89px; height: 38px">mitano<span style="color: #E9806A">.</span></h1>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 24px; background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 8px 24px rgba(168, 65, 44, 0.10)">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 14px">
<label for="user" style="font-size: 12px; font-weight: 500; color: #6B5A54">Dein Benutzername</label>
<input id="user" type="text" style="height: 26px; padding: 0; font-family: inherit; font-size: 16px; color: #0A0A0A; background: transparent; border: none; outline: none">
</div>
<div style="height: 1px; margin: 0 14px; background: rgba(107, 90, 84, 0.15)"></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 14px">
<label for="pw" style="font-size: 12px; font-weight: 500; color: #6B5A54">Passwort</label>
<input id="pw" type="password" style="height: 26px; padding: 0; font-family: inherit; font-size: 16px; color: #0A0A0A; background: transparent; border: none; outline: none">
</div>
</div>
<div style="height: 4px"></div>
<div style="display: flex; flex-direction: column; border-radius: 20px; background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 8px 24px rgba(168, 65, 44, 0.10)">
<div style="display: flex; flex-direction: row; align-items: center; gap: 4px; padding: 4px 4px 4px 16px">
<label style="flex: 1; display: flex; flex-direction: row; gap: 10px; align-items: center; min-height: 44px; font-size: 14px; color: #0A0A0A; cursor: pointer">
<input type="checkbox" style="flex: none; width: 20px; height: 20px; margin: 0; accent-color: #C25A44">
<span>Ich nutze nur Testdaten</span>
</label>
<button type="button" onClick="{{ toggle }}" aria-expanded="{{ open }}" aria-label="Hinweis anzeigen" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B5A54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{ chev }}"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 0 16px 14px; font-size: 13px; line-height: 1.5; color: #3A2A25">Kein Ersatz für ärztliche Beurteilung. Diese Demo nutzt Cloud-Dienste, die <a href="#datenschutz" style="color: #3A2A25">nicht DSGVO-konform</a> sind. Bitte nur erfundene oder öffentliche Testdaten eingeben – niemals echte Patientendaten.</p>
</sc-if>
</div>
<button type="button" style="height: 54px; border-radius: 27px; background: rgba(240, 154, 132, 0.32); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 8px 24px rgba(168, 65, 44, 0.14); color: #4A1E14; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Anmelden</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
renderVals() {
const open = !!(this.state && this.state.open);
return {
open: open,
toggle: () => this.setState({ open: !open }),
chev: open ? 'transform: rotate(180deg); transition: transform 0.2s' : 'transition: transform 0.2s'
};
}
}
</script>
</body>
</html>
