<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- App-Icon „Mitano.“: warme Fläche (Creme → Pfirsich → Bernstein), freundliche Glas-Sprechblase,
       Himmelblau- und Salbei-Akzente, der Punkt aus „Mitano.“ als Koralle-Akzent. Ohne Transparenz. -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf3e4"/>
      <stop offset=".55" stop-color="#f9d3b3"/>
      <stop offset="1" stop-color="#f3ad6b"/>
    </linearGradient>
    <radialGradient id="himmel" cx=".18" cy=".14" r=".55">
      <stop offset="0" stop-color="#bcdcf2" stop-opacity=".95"/>
      <stop offset="1" stop-color="#bcdcf2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="salbei" cx=".9" cy=".95" r=".5">
      <stop offset="0" stop-color="#c3dbc6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c3dbc6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset="1" stop-color="#fff6ea" stop-opacity=".86"/>
    </linearGradient>
    <filter id="schatten" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#9a4f12" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#grund)"/>
  <rect width="1024" height="1024" fill="url(#himmel)"/>
  <rect width="1024" height="1024" fill="url(#salbei)"/>
  <!-- Sprechblase -->
  <g filter="url(#schatten)">
    <path d="M512 228c-176 0-306 112-306 262 0 82 39 152 104 200l-22 96c-4 18 15 31 30 21l104-68c28 8 58 12 90 12 176 0 306-112 306-261S688 228 512 228z"
          fill="url(#glas)" stroke="#ffffff" stroke-width="6"/>
  </g>
  <!-- Gesicht: zwei Augen, ein Lächeln -->
  <g fill="none" stroke="#3a2a1d" stroke-linecap="round" stroke-width="34">
    <path d="M410 452v26M614 452v26"/>
    <path d="M418 560c50 44 138 44 188 0"/>
  </g>
  <!-- der Punkt aus „Mitano.“ -->
  <circle cx="790" cy="760" r="58" fill="#ef8a6c"/>
  <circle cx="772" cy="742" r="18" fill="#ffffff" fill-opacity=".55"/>
</svg>
